name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libx11-dev mesa-vulkan-drivers
      - name: Select software Vulkan driver
        run: |
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race -count=1 -tags integration ./...
      - run: GOEXPERIMENT=cgocheck2 go test -count=1 -tags integration ./...
      - run: bash scripts/test-native.sh
  macos-cpu:
    # Compile, link and CPU/mock checks only. These standard runners are not
    # treated as proof of a usable Metal device or successful rendering.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Vulkan loader and headers (no XQuartz required)
        run: brew install pkgconf vulkan-headers vulkan-loader
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: GOEXPERIMENT=cgocheck2 go test -count=1 ./...
      - run: go build ./examples/headless
      - run: bash scripts/test-native.sh
